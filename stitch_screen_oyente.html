<script>
  (function() {
    let connected = false;
    let pulseInterval = null;

    const toggleBtn = document.getElementById('toggle-connect');
    const toggleLabel = document.getElementById('toggle-label');
    const toggleIndicator = document.getElementById('toggle-indicator');
    const stateLabel = document.getElementById('carrier-state-label');
    const stateBullet = document.getElementById('carrier-state-bullet');
    const ring1 = document.getElementById('pulse-ring-1');
    const ring2 = document.getElementById('pulse-ring-2');
    const ring3 = document.getElementById('pulse-ring-3');
    const halo = document.getElementById('halo-glow');
    const core = document.getElementById('transducer-core');
    const networkLed = document.getElementById('network-led');

    // Ambient Acoustic Breathing Loop (Simulated acoustic wavefront)
    let phase = 0;
    function simulateAcousticField() {
      phase += 0.04;
      const energy = connected 
        ? 0.75 + 0.25 * Math.sin(phase * 2.2) 
        : 0.35 + 0.15 * Math.sin(phase);

      const scale1 = 38 + energy * 8;
      const scale2 = 70 + energy * 16;
      const scale3 = 102 + energy * 26;

      ring1.setAttribute('r', scale1);
      ring2.setAttribute('r', scale2);
      ring3.setAttribute('r', scale3);

      if (connected) {
        ring1.setAttribute('opacity', 0.5 + energy * 0.4);
        ring2.setAttribute('opacity', 0.25 + energy * 0.3);
        ring3.setAttribute('opacity', 0.1 + energy * 0.2);
        halo.style.transform = `scale(${1 + energy * 0.5})`;
      } else {
        ring1.setAttribute('opacity', 0.25);
        ring2.setAttribute('opacity', 0.15);
        ring3.setAttribute('opacity', 0.08);
        halo.style.transform = `scale(1)`;
      }

      requestAnimationFrame(simulateAcousticField);
    }
    requestAnimationFrame(simulateAcousticField);

    // Toggle Connection Handling
    toggleBtn.addEventListener('click', () => {
      connected = !connected;
      if (connected) {
        // Active Oyente Conectado state
        toggleBtn.classList.remove('bg-on-background', 'text-surface', 'hover:bg-tertiary-fixed');
        toggleBtn.classList.add('bg-surface-container-high', 'text-primary');
        toggleIndicator.classList.remove('hidden', 'bg-surface-container-highest');
        toggleIndicator.classList.add('bg-primary', 'shadow-sm', 'shadow-primary/50');
        toggleLabel.textContent = 'Oyente Conectado';

        stateLabel.textContent = 'Acústica Sincronizada';
        stateLabel.classList.remove('text-tertiary');
        stateLabel.classList.add('text-primary');

        stateBullet.classList.remove('bg-outline-variant');
        stateBullet.classList.add('bg-primary');

        networkLed.classList.add('animate-pulse');
        core.classList.add('scale-125');
      } else {
        // Disconnected state
        toggleBtn.classList.add('bg-on-background', 'text-surface', 'hover:bg-tertiary-fixed');
        toggleBtn.classList.remove('bg-surface-container-high', 'text-primary');
        toggleIndicator.classList.add('hidden');
        toggleLabel.textContent = 'Toca para Conectar';

        stateLabel.textContent = 'Espectro En Espera';
        stateLabel.classList.add('text-tertiary');
        stateLabel.classList.remove('text-primary');

        stateBullet.classList.add('bg-outline-variant');
        stateBullet.classList.remove('bg-primary');

        networkLed.classList.remove('animate-pulse');
        core.classList.remove('scale-125');
      }
    });

    // QR Sheet modal triggers
    const qrTrigger = document.getElementById('qr-trigger');
    const qrClose = document.getElementById('qr-close');
    const qrModal = document.getElementById('qr-modal');

    qrTrigger.addEventListener('click', () => {
      qrModal.classList.remove('opacity-0', 'pointer-events-none');
    });

    qrClose.addEventListener('click', () => {
      qrModal.classList.add('opacity-0', 'pointer-events-none');
    });
  })();
</script></main></body></html>
